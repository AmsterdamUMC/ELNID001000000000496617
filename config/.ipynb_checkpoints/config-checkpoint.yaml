## Supervised machine learning (RvNR_W0)
# Machine learning (pretreatment response prediction; modality comparison). The sweep is expanded by Snakemake into one job per (modality x model x k). sklearn/TPOT search spaces live in worker.py (they are code); the sweep dimensions and reproducibility settings are declared here.
machine_learning:
  modalities: [TX_BINF, TX_PB, PX_BINF, PX_PB]
  models: [Lasso, Ridge, GaussianNB, ElasticNet, XGBoost]
  k_values: [10, 25, 50, 100, 200, 300, 400, 500]
  n_seeds: 100
  seed: 2025
  metric: roc_auc
  tpot:
    generations: 5
    population_size: 10
    cv: 5
  # feature-matrix export (ml_prepare_data)
  week_column: Week
  week: W0
  label_column: Response
  donor_column: DonorID
  classes: [R, NR]
  positive_class: R
