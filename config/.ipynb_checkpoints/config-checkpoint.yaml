# RNAseq alignment references
reference:
  star_index: /net/beegfs/groups/tytgat/data/bulktranscriptomics/rnasequencing/star_references/ensembl_GRCh38_ensembl104_sjdbO149
  gtf: /net/beegfs/groups/tytgat/data/reference_genesets/homo_sapiens/gencode.v38.annotation.gtf

# Comparatison parameters
analysis_params:
  deseq2:
    min_counts: 10 # gene kept if >= min_counts in >= min_samples
    min_samples: 5
  limma:
    min_detected: 2 # protein kept if non-NA in >= min_detected samples
  fgsea:
    min_size: 15
    max_size: 500
    n_perm_simple: 10000

# Interaction
interaction:
  gene_set: [NFKB2, RELB, CD70, LTA, CD40, CD40LG, TNFRSF8, TNFRSF12A]
  comparisons: [BINF_R_W8vW0, BINF_NR_W8vW0, BINF_RvNR_W0]

# Comparisons
# filter: columns to be filtered on based on the sample metadata
# variable: the tested factor
# contrast: c(numerator, denominator)
# covariates:
#   numeric: Numeric/continuous covariates
#   categorical: categorical covariates

## Tofacitinib (Own data)
comparisons:
  BINF_R_W8vW0:
    assays: [rnaseq, olink]
    filter: {Tissue: [BINF], Response: [R],  Week: [W0, W8]}
    variable: Week
    contrast: [W8, W0]
    block: [DonorID]
    covariates: 
      numeric: [Age]
      categorical: [Sex, Prednisone, Anti_TNF, Vedo]
  BINF_NR_W8vW0:
    assays: [rnaseq, olink]
    filter: {Tissue: [BINF], Response: [NR], Week: [W0, W8]}
    variable: Week
    contrast: [W8, W0]
    block: [DonorID]
