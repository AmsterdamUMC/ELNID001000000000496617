# Supplementary tables
# Each table is compiled from one pipeline output into supplementary_tables/<table>.xlsx (one sheet, named <sheet_prefix>_<comparison>).
# source: one of rnaseq_degs, rnaseq_fgsea, olink_deps, melonardanaz2025_degs, melonardanaz2025_fgsea, toedter2011_degs, toedter2011_fgsea (path templates and column layouts are defined in workflow/rules/supplementary_tables.smk and workflow/scripts/supplementary_tables/compile_table.py).
# legend: written to supplementary_tables/supplementary_table_legends.txt

supplementary_tables:
  tableS1:
    source: rnaseq_degs
    comparison: BINF_RvNR_W0
    legend: >-
      Supplementary Table 1. Differential gene expression analysis results from inflamed mucosal biopsy comparing responders with non-responders at baseline, derived using DESeq2.
      Columns: gene_symbol, gene symbol; ENSG, Ensembl identifier; baseMean, the mean normalized count across all samples; log2FoldChange; lfcSE, standard error of the log2 fold change; stat, Wald statistic; pvalue, nominal p-value; padj, Benjamini-Hochberg adjusted p-value.
  tableS2:
    source: rnaseq_fgsea
    comparison: BINF_RvNR_W0
    legend: >-
      Supplementary Table 2. Gene set enrichment analysis results from inflamed mucosal biopsy comparing responders with non-responders at baseline, derived using pre-ranked fgsea against the Wald statistic obtained from Supplementary Table 1.
      Columns: pathway, pathway identifier; pvalue, nominal p-value; padj, Benjamini-Hochberg adjusted p-value; log2err, the expected error for the standard deviation of the p-value logarithm; ES, enrichment score; NES, enrichment score normalized to mean enrichment of random samples of the same size; size, size of the pathway; leadingEdge, genes that drive the enrichment (pipe-delimited).
